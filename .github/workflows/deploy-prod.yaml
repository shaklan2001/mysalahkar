name: Deploy MySalahkar website (prod)

# Copy this file only into frontend-main: .github/workflows/deploy-prod.yaml
# The deploy steps live in this infra repo and are called below.
# Reusable workflows live in devops-internal. No token: that private repo must allow Actions access from this organization.

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Commit SHA (or branch/tag) Dev named. Checkout only. Run this workflow from main; that is what the OIDC trust checks."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: mysalahkar-insights/devops-internal/.github/workflows/deploy-frontend-prod.yaml@main
    with:
      git_ref: ${{ inputs.git_ref }}
