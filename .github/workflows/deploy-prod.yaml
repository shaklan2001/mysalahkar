name: Deploy MySalahkar website (prod)
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Commit SHA (or branch/tag) Dev named. Checkout only. Run this workflow from main; that is what the OIDC trust checks."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: mysalahkar-insights/devops-internal/.github/workflows/deploy-frontend-prod.yaml@main
    with:
      git_ref: ${{ inputs.git_ref }}
