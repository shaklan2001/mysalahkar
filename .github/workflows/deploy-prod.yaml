name: Deploy MySalahkar website (prod)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Commit SHA, branch, or tag to build and deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: mysalahkar-insights/devops-internal/.github/workflows/deploy-frontend-prod.yaml@main
    with:
      git_ref: ${{ inputs.git_ref }}
